name: Go Build (Self-hosted)

on:
  push:
    branches: [ Web ]
  pull_request:
    branches: [ Web ]

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Instalar dependencias Go
        run: go mod download

      - name: Compilar proyecto
        run: go build -o server ./web
