name: Go Lint (Self-hosted)

on:
  push:
    branches: [ Web ]
  pull_request:
    branches: [ Web ]

jobs:
  lint:
    runs-on: self-hosted

    steps:
      - name: Checkout código
        uses: actions/checkout@v3

      - name: Instalar dependencias Go
        run: go mod download

      - name: Instalar golangci-lint (si no existe)
        run: |
          if ! command -v golangci-lint &> /dev/null; then
            echo "Instalando golangci-lint..."
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /tmp v1.59.1
            sudo mv /tmp/golangci-lint /usr/local/bin/
          else
            echo "golangci-lint ya está instalado"
          fi

      - name: Ejecutar golangci-lint
        run: golangci-lint run ./...
