<head>
    <meta charset="UTF-8">
    <title>XCipherGo</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Roboto:wght@400;700&display=swap"
        rel="stylesheet">

    <!-- Animate.css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css" />

    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container py-5">
        <h1 class="mb-4 text-center animate__animated animate__fadeInDown">🔐 XCipherGo</h1>

        <!-- Subida de archivo -->
        <div class="mb-3 text-center">
            <label for="fileInput" class="form-label">Selecciona un archivo</label>
            <div id="fileDropBox" class="border p-5 rounded">
                📂 Arrastra un archivo aquí o haz clic
            </div>
            <input class="form-control mt-2" type="file" id="fileInput" hidden>
        </div>

        <!-- Tipo de acción -->
        <div class="mb-3">
            <label for="actionSelect" class="form-label">¿Qué quieres hacer?</label>
            <select class="form-select" id="actionSelect">
                <option value="select">Selecciona una opción</option>
                <option value="encrypt">Encriptar</option>
                <option value="decrypt">Desencriptar</option>
            </select>
        </div>

        <!-- Tipo de cifrado -->
        <div class="mb-3">
            <label for="cipherSelect" class="form-label">Tipo de cifrado</label>
            <select class="form-select" id="cipherSelect">
                <option value="select">Selecciona un tipo</option>
                <option value="cesar">César</option>
                <option value="aes">AES</option>
            </select>
        </div>

        <!-- Parámetros dinámicos -->
        <div id="cipherParams" style="display:none;" class="mb-3"></div>

        <!-- Botón -->
        <div class="d-grid">
            <button id="processButton"
                class="btn btn-lg">Procesar</button>
        </div>
    </div>
        <div class="alert-message">
            ❗️❗️ Por favor, asegúrate de guardar el archivo con la extensión correcta (por ejemplo: .txt, .enc, .dat) antes de
            descargarlo.
        </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const fileInput = document.getElementById("fileInput");
            const fileDropBox = document.getElementById("fileDropBox");
            const cipherSelect = document.getElementById("cipherSelect");
            const cipherParams = document.getElementById("cipherParams");
            const processButton = document.getElementById("processButton");
            const actionSelect = document.getElementById("actionSelect");

            // Click en dropbox
            fileDropBox.addEventListener("click", () => fileInput.click());

            // Cambio en input file
            fileInput.addEventListener("change", () => {
                if (fileInput.files.length > 0) {
                    fileDropBox.textContent = "✅ Archivo listo: " + fileInput.files[0].name;
                }
            });

            // Drag & Drop
            fileDropBox.addEventListener("dragover", (e) => {
                e.preventDefault();
                fileDropBox.classList.add("border-primary");
            });

            fileDropBox.addEventListener("dragleave", (e) => {
                e.preventDefault();
                fileDropBox.classList.remove("border-primary");
            });

            fileDropBox.addEventListener("drop", (e) => {
                e.preventDefault();
                fileDropBox.classList.remove("border-primary");
                const files = e.dataTransfer.files;
                if (files.length > 0) {
                    const dataTransfer = new DataTransfer();
                    dataTransfer.items.add(files[0]);
                    fileInput.files = dataTransfer.files;
                    fileDropBox.textContent = "✅ Archivo listo: " + files[0].name;
                }
            });

            // Cambio en tipo de cifrado
            cipherSelect.addEventListener("change", function () {
                const cipherType = cipherSelect.value;
                if (cipherType === "cesar") {
                    showCesarParams();
                } else if (cipherType === "aes") {
                    showAesParams();
                } else {
                    showSelectParams();
                }
            });

            function showSelectParams() {
                cipherParams.innerHTML = ``;
                cipherParams.style.display = "none";
            }

            function showCesarParams() {
                cipherParams.innerHTML = `
            <label for="shift" class="form-label">Desplazamiento (número entero):</label>
            <input type="number" id="shift" name="shift" class="form-control" required min="1">
        `;
                cipherParams.style.display = "block";
            }

            function showAesParams() {
                cipherParams.innerHTML = `
            <label for="pass" class="form-label">Contraseña AES:</label>
            <input type="password" id="pass" name="pass" class="form-control" required placeholder="Contraseña">
        `;
                cipherParams.style.display = "block";
            }

            processButton.addEventListener("click", async function () {
                if (fileInput.files.length === 0) {
                    alert("Por favor selecciona un archivo primero.");
                    return;
                }

                const action = actionSelect.value;
                const cipherType = cipherSelect.value;

                if (action === "select") {
                    alert("Selecciona si quieres encriptar o desencriptar.");
                    return;
                }

                if (cipherType === "select") {
                    alert("Selecciona un tipo de cifrado.");
                    return;
                }

                const formData = new FormData();
                formData.append("file", fileInput.files[0]);

                let endpoint = "";
                let filename = "";

                if (cipherType === "cesar") {
                    const shift = document.getElementById("shift").value;
                    if (!shift) {
                        alert("Ingresa el desplazamiento para el cifrado César.");
                        return;
                    }
                    formData.append("shift", shift);

                    if (action === "encrypt") {
                        endpoint = "/cesarenc";
                        filename = "cesar_encrypted_file.txt";
                    } else {
                        endpoint = "/cesardec";
                        filename = "cesar_decrypted_file";
                    }

                } else if (cipherType === "aes") {
                    const pass = document.getElementById("pass").value;
                    if (!pass) {
                        alert("Ingresa la contraseña para AES.");
                        return;
                    }
                    formData.append("pass", pass);

                    if (action === "encrypt") {
                        endpoint = "/encrypt";
                        filename = "aes_encrypted_file";
                    } else {
                        endpoint = "/decrypt";
                        filename = "aes_decrypted_file";
                    }
                }

                // Enviar la petición al servidor
                const response = await fetch(endpoint, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    alert("Error durante el procesamiento.");
                    return;
                }

                const blob = await response.blob();
                downloadFile(blob, filename);
            });

            // Descargar archivo
            function downloadFile(blob, filename) {
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = filename;
                a.click();
                window.URL.revokeObjectURL(url);
            }
        });
    </script>

</body>

</html>
